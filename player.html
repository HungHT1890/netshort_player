<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

video{
width:100%;
max-width:900px;
background:#000;
}

</style>

</head>

<body>

<video id="video" controls playsinline webkit-playsinline preload="metadata">
<source id="video_src" type="video/mp4">
</video>

<script>

const params = new URLSearchParams(location.search)

const video = params.get("v")
const sub = params.get("s")

const videoEl = document.getElementById("video")

if(video){
document.getElementById("video_src").src = decodeURIComponent(video)
}

async function loadSubtitle(url){

try{

const res = await fetch(url,{referrerPolicy:"no-referrer"})
let text = await res.text()

/* fix encoding subtitle */

text = decodeURIComponent(escape(text))

/* tạo blob */

const blob = new Blob([text],{type:"text/vtt"})
const blobUrl = URL.createObjectURL(blob)

const track = document.createElement("track")

track.kind = "subtitles"
track.label = "Vietnamese"
track.srclang = "vi"
track.src = blobUrl
track.default = true

videoEl.appendChild(track)

/* bật subtitle */

track.addEventListener("load", () => {

videoEl.textTracks[0].mode = "showing"

})

}catch(e){

console.log("subtitle error",e)

}

}

if(sub){
loadSubtitle(sub)
}

videoEl.load()

</script>

</body>
</html>
