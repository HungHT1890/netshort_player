<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">

<title>Video Player</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

video{
width:100%;
max-width:900px;
background:#000;
}

</style>

</head>

<body>

<video id="video" controls playsinline webkit-playsinline preload="metadata">
<source id="video_src" type="video/mp4">
<track id="sub_track" kind="subtitles" srclang="vi" label="Vietnamese" default>
</video>

<script>

const params = new URLSearchParams(location.search)

const video = params.get("v")
const sub = params.get("s")

if(video){

document.getElementById("video_src").src = decodeURIComponent(video)

}

const videoEl = document.getElementById("video")

async function loadSubtitle(url){

try{

const res = await fetch(url,{referrerPolicy:"no-referrer"})
let text = await res.text()

/* fix encoding lỗi kiểu: Trá»£i */

text = decodeURIComponent(escape(text))

/* tạo blob để attach subtitle */

const blob = new Blob([text],{type:"text/vtt"})
const blobUrl = URL.createObjectURL(blob)

document.getElementById("sub_track").src = blobUrl

}catch(e){

console.log("subtitle load fail")

}

}

if(sub){

loadSubtitle(sub)

}

videoEl.load()

</script>

</body>
</html>
