<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">

<title>Video Player</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

video{
width:100%;
max-width:900px;
background:#000;
}

</style>

</head>

<body>

<video id="video" controls playsinline webkit-playsinline preload="metadata">
<source id="video_src" type="video/mp4">
</video>

<script>

const params = new URLSearchParams(location.search)

const videoUrl = params.get("v")
const subUrl = params.get("s")

const video = document.getElementById("video")

if(videoUrl){
document.getElementById("video_src").src = decodeURIComponent(videoUrl)
}

async function loadSubtitle(url){

try{

const res = await fetch(url,{referrerPolicy:"no-referrer"})

/* đọc subtitle dạng binary */

const buffer = await res.arrayBuffer()

/* decode UTF8 */

let text = new TextDecoder("utf-8").decode(buffer)

/* đảm bảo header WEBVTT */

text = text.trim()

if(!text.startsWith("WEBVTT")){
text = "WEBVTT\n\n" + text
}

/* tạo blob subtitle */

const blob = new Blob([text],{type:"text/vtt"})
const blobUrl = URL.createObjectURL(blob)

/* tạo track */

const track = document.createElement("track")

track.kind = "subtitles"
track.label = "Vietnamese"
track.srclang = "vi"
track.src = blobUrl
track.default = true

video.appendChild(track)

/* bật subtitle */

track.addEventListener("load", () => {

for(const t of video.textTracks){
t.mode = "showing"
}

})

}catch(e){

console.log("subtitle error:",e)

}

}

if(subUrl){
loadSubtitle(subUrl)
}

video.load()

</script>

</body>
</html>
